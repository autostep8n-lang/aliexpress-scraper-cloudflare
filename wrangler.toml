name = "aliexpress-scraper-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]

# Publish the Worker to your workers.dev subdomain by default.
workers_dev = true

# ============================================================================
# Bindings
# ----------------------------------------------------------------------------
# SUPABASE_URL and SUPABASE_SECRET_KEY are runtime secrets configured in the
# Cloudflare dashboard ("Settings > Variables and Secrets") or via
# `wrangler secret put`. The actual values are NEVER stored in this file.
#
# `keep_vars = true` is required here: without it, Wrangler treats this config
# file as the source of truth for environment variables and OVERRIDES any
# variables configured in the Cloudflare dashboard on the next deploy. Because
# the Supabase bindings were previously not declared here (and keep_vars was
# unset), each `wrangler deploy` removed them from the deployed Worker, so the
# runtime saw no SUPABASE_URL / SUPABASE_SECRET_KEY and /health/supabase
# reported "supabase not configured".
#
# The `[secrets]` section declares the secret names the Worker requires.
# `wrangler deploy` validates that all of these exist on the Worker and fails
# fast with a clear error if any are missing, so a broken deployment cannot be
# silently pushed. Values still come from Cloudflare / `wrangler secret put`:
#
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SECRET_KEY
# ============================================================================

keep_vars = true

[secrets]
required = [ "SUPABASE_URL", "SUPABASE_SECRET_KEY" ]

# --- Optional KV namespace for caching scraped results -----------------------
# [kv_namespaces]
# SCRAPE_CACHE = { id = "<namespace-id>" }

# --- Optional R2 bucket for storing assets / raw HTML ------------------------
# [r2_buckets]
# SCRAPE_ASSETS = { bucket_name = "scraping-assets" }

# --- Cloudflare Browser Run (Browser Rendering) binding ----------------------
# Used by the TikTok Shop scraper to render product pages that TikTok answers
# with a "Security Check" challenge page (or a client-side-only shell) when
# fetched directly from Worker datacenter IPs. Runs a real headless Chromium
# on Cloudflare's network: genuine browser TLS fingerprint + JavaScript
# execution, so the SSR product data TikTok would otherwise withhold becomes
# available to the existing parser.
#
# AliExpress notes: AliExpress's anti-bot (_____tmd_____/punish, x5sec) also
# punishes headless browsers, so the AliExpress scraper only reaches this
# binding as a LAST resort. It first queries the no-browser providers: the
# official Open Platform API (when ALIEXPRESS_OPENAPI_KEY/SECRET are set) and
# the internal mtop gateway the website itself uses.
#
# Requirements:
#   - The account must have Browser Rendering / Browser Run enabled
#     (Workers Paid). Workers Free is limited to 10 browser-minutes/day.
#   - Quick Actions (`env.BROWSER.quickAction("content", ...)`) need a
#     compatibility_date of 2026-03-24 or later (this project uses
#     2026-08-17, so it is satisfied).
#   - Local `wrangler dev` needs `--remote` (or `remote = true` here) for
#     Quick Actions; unit tests mock the binding instead.
[browser]
binding = "BROWSER"

# ============================================================================
# Optional AliExpress Open Platform credentials (open.aliexpress.com)
# ----------------------------------------------------------------------------
# When present, the AliExpress scraper prefers the official
# `aliexpress.ds.product.get` API - the production-grade, anti-bot-free
# provider. These are OPTIONAL and must be set as secrets on the Worker (they
# are not declared under `[secrets].required`, so deploys succeed without them):
#
#   npx wrangler secret put ALIEXPRESS_OPENAPI_KEY
#   npx wrangler secret put ALIEXPRESS_OPENAPI_SECRET
#
# See src/scrapers/aliexpress-openapi.ts for the signing protocol and the
# app-registration steps. Without credentials the scraper falls back to the
# internal mtop gateway, which needs no API key.
# ============================================================================

# ============================================================================
# Optional Reddit OAuth2 app-only credentials (www.reddit.com/prefs/apps)
# ----------------------------------------------------------------------------
# When present, the Reddit market-intelligence module (/api/market/reddit)
# collects via the official oauth.reddit.com API. These are OPTIONAL and must
# be set as secrets on the Worker (they are not declared under
# `[secrets].required`, so deploys succeed without them):
#
#   npx wrangler secret put REDDIT_CLIENT_ID
#   npx wrangler secret put REDDIT_CLIENT_SECRET
#
# Reddit also requires a descriptive user agent; REDDIT_USER_AGENT may be set
# the same way (a sensible default is used when absent). Without credentials
# the module degrades with a typed REDDIT_NOT_CONFIGURED error.
# See src/market/reddit.ts.
# ============================================================================
