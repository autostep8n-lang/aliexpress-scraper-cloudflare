name = "aliexpress-scraper-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]

# Publish the Worker to your workers.dev subdomain by default.
workers_dev = true

# ============================================================================
# Bindings
# ----------------------------------------------------------------------------
# SUPABASE_URL and SUPABASE_SECRET_KEY are runtime secrets configured in the
# Cloudflare dashboard ("Settings > Variables and Secrets") or via
# `wrangler secret put`. The actual values are NEVER stored in this file.
#
# `keep_vars = true` is required here: without it, Wrangler treats this config
# file as the source of truth for environment variables and OVERRIDES any
# variables configured in the Cloudflare dashboard on the next deploy. Because
# the Supabase bindings were previously not declared here (and keep_vars was
# unset), each `wrangler deploy` removed them from the deployed Worker, so the
# runtime saw no SUPABASE_URL / SUPABASE_SECRET_KEY and /health/supabase
# reported "supabase not configured".
#
# The `[secrets]` section declares the secret names the Worker requires.
# `wrangler deploy` validates that all of these exist on the Worker and fails
# fast with a clear error if any are missing, so a broken deployment cannot be
# silently pushed. Values still come from Cloudflare / `wrangler secret put`:
#
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SECRET_KEY
# ============================================================================

keep_vars = true

[secrets]
required = [ "SUPABASE_URL", "SUPABASE_SECRET_KEY" ]

# --- Optional KV namespace for caching scraped results -----------------------
# [kv_namespaces]
# SCRAPE_CACHE = { id = "<namespace-id>" }

# --- Optional R2 bucket for storing assets / raw HTML ------------------------
# [r2_buckets]
# SCRAPE_ASSETS = { bucket_name = "scraping-assets" }
